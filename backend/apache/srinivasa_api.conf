# Dr. Srinivasa C website API. Only the srinivasa and shared auth endpoints are exposed on this hostname.
<VirtualHost *:80>
    ServerName 3-110-119-176.sslip.io
    DocumentRoot /var/www/html
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName 3-110-119-176.sslip.io
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/3-110-119-176.sslip.io/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/3-110-119-176.sslip.io/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    WSGIDaemonProcess srinivasa_api python-home=/home/ubuntu/projects/dr_ajay/backend/venv python-path=/home/ubuntu/projects/dr_ajay/backend processes=1 threads=5 display-name=%{GROUP}
    WSGIProcessGroup srinivasa_api
    WSGIApplicationGroup %{GLOBAL}
    WSGIPassAuthorization On
    WSGIScriptAlias / /home/ubuntu/projects/dr_ajay/backend/config/wsgi.py

    <Directory /home/ubuntu/projects/dr_ajay/backend/config>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    <Location />
        Require all denied
    </Location>
    <LocationMatch "^/api/(srinivasa|auth)/">
        Require all granted
    </LocationMatch>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    ErrorLog ${APACHE_LOG_DIR}/srinivasa_api_error.log
    CustomLog ${APACHE_LOG_DIR}/srinivasa_api_access.log combined
</VirtualHost>
